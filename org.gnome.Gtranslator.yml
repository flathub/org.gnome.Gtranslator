id: org.gnome.Gtranslator
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: gtranslator
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --filesystem=xdg-download
  - --metadata=X-DConf=migrate-path=/org/gnome/Gtranslator/
modules:
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Dintrospection=disabled
      - -Ddocs=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.11.tar.xz
        sha256: 52e53ec3fba0f604cfd0931e26af7f7241a0d4f0208dd5574f43b3589f6d28b2
        x-checker-data:
          type: gnome
          name: libspelling

  - name: gtranslator
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtranslator/51/gtranslator-51.0.tar.xz
        sha256: 2dc283b4e36624064bdc85e657eb4de1eb01feba62a1b0eb3b2221fc6c02c75a
        x-checker-data:
          type: gnome
          name: gtranslator
